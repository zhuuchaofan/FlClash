name: android-apk

# Builds the Flare APK for every push to main, so the fork has an installable
# build without the upstream release pipeline, which only runs on upstream tags.
# A v* tag also publishes a GitHub release the in-app updater reads.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The updater names the asset after the tag and compares the tag with the
      # installed version, so a tag that disagrees with pubspec never updates.
      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match pubspec version $version"
            exit 1
          fi

      # Without one fixed key every run signs with a fresh debug key, and
      # Android refuses to install a build over one signed differently.
      - name: Setup Android Signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Warn about a debug-signed build
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        if: env.KEYSTORE == ''
        run: echo "::warning::No KEYSTORE secret; this APK is debug-signed and cannot update one from another run."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: flutter pub get

      # Same pinned bundle as build.yaml: the core embeds it.
      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Flare-android-${{ github.sha }}
          path: ./dist

      - name: Check the release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          ls -l dist
          test -f "dist/Flare-$version-android-arm64-v8a.apk"

      - name: Generate sha256
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
